name: Bug report
description: Something did not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste the contents of `.credentials.json`, `auth.json`,
        or any token. Shambles never needs them to diagnose a problem.

  - type: dropdown
    id: os
    attributes:
      label: Where are you running Shambles?
      description: >
        Asked first because it decides almost every answer. Linux and WSL are
        in daily use. macOS and native Windows are checked on CI machines with
        made-up credentials, and nobody has yet reported a real account there,
        so a report from either is especially welcome. Please run
        `shambles doctor` and paste what it prints; it contains no credentials.
      options:
        - Linux
        - WSL (running the Linux build inside WSL)
        - Windows (native, not WSL)
        - macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Which version?
      description: The output of `shambles --version`.
      placeholder: shambles 2.1.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - install.sh (curl)
        - install.ps1 (PowerShell)
        - pipx
        - Downloaded a binary from Releases
        - From a clone
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Any error output
      description: Paste it here. It is formatted as code automatically.
      render: text
