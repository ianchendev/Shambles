name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        # macOS ran this suite only when a release was tagged, which is the
        # worst moment to learn it fails. One Python is enough to catch a
        # platform difference; the version spread is covered above.
        include:
          - os: macos-15
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # xvfb gives the GUI tests a real display. Without it they skip, and the
      # render and shutdown suites are exactly the ones worth running in CI.
      - name: Install X server (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The Qt window's tests draw offscreen and need no display, but loading
      # Qt at all needs these, and a bare runner has none of them. Without
      # them every test under tests/qt that touches Qt skips, silently.
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
             libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
             libxcb-render-util0 libxcb-xkb1 libdbus-1-3 libfontconfig1

      - name: Install
        run: pip install -e ".[dev,gui]"

      # A skip here would mean the window's tests ran nowhere. Fail instead.
      - name: Qt loads
        run: python -c "import PySide6.QtQuick, PySide6; print('PySide6', PySide6.__version__)"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test (Linux, with display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -rs

      # No xvfb on macOS: Tk talks to the window server, not X11, and the GUI
      # tests skip themselves on a TclError when no display answers.
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest -rs

      # No retries, on any platform. The terminal-UI tests used to assert
      # after a fixed number of event-loop pumps, and Textual finishes a
      # layout over an indeterminate number of frames, so the slow Windows
      # runners lost a different handful of those bets every run and each
      # test was retried up to five times. The retries also hid a real bug: a
      # header that kept the height of the text it replaced and pushed the
      # account list off the screen for good (#49). Every such test now
      # waits for the condition it asserts, by the clock, and fails with the
      # whole screen if it never holds (tests/settling.py). A failure here is
      # a finding: investigate it, do not add retries back.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -rs
