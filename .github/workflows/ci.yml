name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # xvfb gives the GUI tests a real display. Without it they skip, and the
      # render and shutdown suites are exactly the ones worth running in CI.
      - name: Install X server (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test (Linux, with display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v
