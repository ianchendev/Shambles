name: real-machine

# What the test suite cannot say from behind its fakes: on a real macOS
# Keychain and a real Windows Credential Manager, with the vendors' own
# programs installed, does a switch change who the vendor says is signed in?
#
# Every job is a throwaway machine with made-up credentials. The vendor CLIs
# are installed fresh each run, so this is also the early warning for a
# vendor moving where it keeps its login.
#
# Required or advisory. The machines run on every pull request. Whether
# their result counts depends on what the pull request changes: if it touches
# a path in .github/real-machine-paths.txt (the stores, the provider specs,
# the install scripts, the build), every machine must pass; otherwise a
# failure shows on the pull request but does not stop it merging. A vendor
# release can turn these red with no change of ours, and that should not
# block a README fix.
#
# The check to require in branch protection is the last job, "real-machine".
# It reports on every pull request, which a required check has to, and it
# waits for the machines either way, so on a pull request that does not need
# them it still passes only once they have finished. Do not require the
# individual machine jobs, and do not add a `paths:` filter to the trigger;
# either one leaves a required check that never reports on some pull
# requests, and those can then never merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Vendors ship several times a week. Without a schedule, a moved login is
  # only noticed the next time somebody opens a pull request here.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A second push to the same pull request replaces the run for the first.
# Anything else gets a group of its own and is never cancelled.
concurrency:
  group: real-machine-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: does this change need every machine to pass
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.decide.outputs.required }}
    steps:
      # The rule as it stands on the branch being merged into, not as the
      # pull request would like it to be. A pull request that edits the list
      # or the script is judged by the versions it is trying to replace,
      # which list themselves.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request ($EVENT): every machine must pass."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both names of a renamed file, so that moving something out of a
          # listed directory counts as changing it.
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL/files" --paginate \
                 --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt; then
            echo "Could not list the changed files, so every machine must pass."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The API stops at 3000 files. A change that large counts as relevant.
          if [ "$(wc -l < changed.txt)" -ge 3000 ]; then
            echo "Too many changed files to list, so every machine must pass."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exit 0: a listed path changed. Exit 1: none did. Anything else
          # means the rule could not be applied (the base branch may predate
          # it), and then every machine must pass.
          code=0
          python3 .github/scripts/real_machine_required.py \
            .github/real-machine-paths.txt < changed.txt || code=$?
          case "$code" in
            0)
              echo "The paths above are in .github/real-machine-paths.txt: every machine must pass."
              echo "required=true" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "Nothing in .github/real-machine-paths.txt changed: the machines are advisory."
              echo "required=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Could not apply the rule (exit $code), so every machine must pass."
              echo "required=true" >> "$GITHUB_OUTPUT" ;;
          esac

  machine:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - macos-15-intel
          - windows-2022
          - windows-2025
          - windows-11-arm
          - ubuntu-22.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # A hang used to run to GitHub's six-hour limit (three did, in
    # tests/test_gui_import.py, before #52). The slowest of these takes about
    # 11 minutes, so 30 is room to spare and still ends a hang within the hour.
    timeout-minutes: 30
    env:
      SHAMBLES_REAL_MACHINE: "1"
      SHAMBLES_REQUIRE_VENDORS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shambles
        run: pip install -e ".[dev]" pyinstaller

      # npm, because it is the one install method that is the same command
      # on all three systems. It places the same native binary the vendors'
      # own installers do.
      - name: Install the vendor CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      # Bun.secrets is the API Claude Code uses for Credential Manager.
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'

      - name: Real stores and vendor CLIs, from source
        run: python -m pytest tests/real -v -s -rA -p no:cacheprovider

      - uses: ./.github/actions/build-binary

      - name: Real stores and vendor CLIs, built binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export SHAMBLES_BIN="$(cygpath -w "$PWD/dist/shambles.exe")"
          else
            export SHAMBLES_BIN="$PWD/dist/shambles"
          fi
          python -m pytest tests/real -v -s -rA -p no:cacheprovider

  # Systems the binaries cannot run on. The install script is meant to say so
  # before it downloads anything, which only a real old glibc and a real
  # musl can confirm. Nothing is downloaded: the check comes first.
  cannot-run-here:
    name: install.sh on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:20.04
            setup: apt-get update -qq && apt-get install -y -qq curl >/dev/null
            expect: "glibc 2.31"
          - image: alpine:3.20
            setup: apk add --no-cache bash curl >/dev/null
            expect: "musl"
    steps:
      - uses: actions/checkout@v4

      - name: The installer refuses, says why, and names the install that works
        run: |
          set +e
          out="$(docker run --rm -v "$PWD/scripts:/scripts:ro" ${{ matrix.image }} \
                 sh -c '${{ matrix.setup }} && bash /scripts/install.sh' 2>&1)"
          code=$?
          set -e
          echo "$out"
          echo "exit: $code"
          test "$code" -ne 0
          echo "$out" | grep -q "${{ matrix.expect }}"
          echo "$out" | grep -q "pipx install"
          if echo "$out" | grep -q "Downloading"; then
            echo "it downloaded before refusing" >&2
            exit 1
          fi

  # The SwiftUI menu-bar panel in macos/ talks to the CLI's JSON output. It
  # had never been built by anything but its author's machine. This builds
  # it and runs its tests, including the one that starts the real CLI.
  #
  # macOS 26 only. The panel calls glassEffect, which exists only in the
  # macOS 26 SDK; it is guarded at run time for older systems, but the source
  # does not compile against the macOS 15 SDK (Swift 6.1, Xcode 16), which is
  # what the macos-15 runner has. Building needs Xcode 26.
  swift-app:
    name: swift app (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Where the Swift integration test looks for the CLI.
      - name: Install Shambles into the checkout's virtualenv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .

      - name: Build
        working-directory: macos
        run: |
          swift --version
          swift build

      - name: Test
        working-directory: macos
        run: swift test

  # The one check to require. See the note at the top of this file.
  #
  # `always()` is what makes it report when a job it waits for failed or was
  # cancelled; without it this job would be skipped in exactly those cases,
  # and branch protection counts a skipped check as a pass.
  result:
    name: real-machine
    needs: [changes, machine, cannot-run-here, swift-app]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          MACHINE: ${{ needs.machine.result }}
          CANNOT_RUN_HERE: ${{ needs.cannot-run-here.result }}
          SWIFT_APP: ${{ needs.swift-app.result }}
        run: |
          echo "machines: $MACHINE"
          echo "install.sh where it cannot run: $CANNOT_RUN_HERE"
          echo "swift app: $SWIFT_APP"
          failed=0
          for outcome in "$MACHINE" "$CANNOT_RUN_HERE" "$SWIFT_APP"; do
            [ "$outcome" = "success" ] || failed=1
          done
          if [ "$failed" = "0" ]; then
            echo "Every machine passed."
            exit 0
          fi
          # A job marked cancelled with no steps was never given a runner by
          # GitHub (macOS capacity), which is not a test failure.
          hint="Re-run the failed jobs; one marked cancelled with no steps was never given a runner."
          if [ "$CHANGES" = "success" ] && [ "$REQUIRED" = "false" ]; then
            echo "::warning::A real-machine job did not pass. This change touches nothing in .github/real-machine-paths.txt, so it does not block merging. $hint"
            exit 0
          fi
          echo "::error::A real-machine job did not pass, and this change touches a path in .github/real-machine-paths.txt (or that could not be decided). $hint"
          exit 1
