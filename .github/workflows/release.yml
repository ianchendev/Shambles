name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest. PyInstaller bundles the build machine's
          # libraries, so building on 24.04 stamped a GLIBC_2.38 floor onto
          # 2.1.0 and it would not start on Ubuntu 22.04, Debian 12 or RHEL 9.
          # Building here targets glibc 2.35, and check_glibc.py holds it.
          - os: ubuntu-22.04
            artifact: shambles-linux-x86_64
            window: shambles-window-linux-x86_64.tar.gz
            built: dist/shambles
          - os: ubuntu-22.04-arm
            artifact: shambles-linux-arm64
            window: shambles-window-linux-arm64.tar.gz
            built: dist/shambles
          # macos-15-intel is the last x86_64 macOS image GitHub offers (the
          # macos-13 label was retired in December 2025) and it disappears in
          # August 2027. macos-15 is Apple Silicon, so the two labels are what
          # produce the two different macOS artifacts -- PyInstaller builds for
          # the architecture it runs on and does not cross-compile.
          - os: macos-15-intel
            artifact: shambles-macos-x86_64
            window: shambles-window-macos-x86_64.tar.gz
            built: dist/shambles
          - os: macos-15
            artifact: shambles-macos-arm64
            window: shambles-window-macos-arm64.tar.gz
            built: dist/shambles
          - os: windows-latest
            artifact: shambles-windows-x64.exe
            windowed: shamblesw-windows-x64.exe
            window: shambles-window-windows-x64.zip
            built: dist/shambles.exe
          # Native, not emulated. Windows 11 on Arm runs the x64 build under
          # emulation, and the installer falls back to it for releases older
          # than this entry; this one starts faster and is what the
          # real-machine workflow exercises on the same runner label.
          - os: windows-11-arm
            artifact: shambles-windows-arm64.exe
            windowed: shamblesw-windows-arm64.exe
            window: shambles-window-windows-arm64.zip
            built: dist/shambles.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X server (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb binutils

      - name: Install
        run: pip install -e ".[dev]" pyinstaller

      # A tag that disagrees with the packaged version ships a binary that
      # announces an update to itself: update_check compares the release tag
      # against __version__, so with checks on every user would be told 2.1.0
      # is available while running a binary that reports 2.0.0 -- and
      # re-running the installer would hand them the same binary, forever.
      # tests/test_packaging.py already pins __version__ against pyproject;
      # only CI can see the tag, so the third side of that triangle lives here.
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import shambles; print(shambles.__version__)')"
          if [ "$tag" != "$code" ]; then
            echo "Tag $GITHUB_REF_NAME does not match shambles.__version__ ($code)." >&2
            echo "Bump shambles/__init__.py and pyproject.toml, or retag." >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $code."

      # Never ship a build that has not passed its own suite.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      # No xvfb on macOS: Tk talks to the window server, not X11, and the GUI
      # tests already skip themselves on a TclError when no display answers.
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest

      # No retries, on any platform. The terminal-UI tests used to assert
      # after a fixed number of event-loop pumps, and Textual finishes a
      # layout over an indeterminate number of frames, so the slow Windows
      # runners lost a different handful of those bets every run and each
      # test was retried up to five times. The retries also hid a real bug: a
      # header that kept the height of the text it replaced and pushed the
      # account list off the screen for good (#49). Every such test now
      # waits for the condition it asserts, by the clock, and fails with the
      # whole screen if it never holds (tests/settling.py). A failure here is
      # a finding: investigate it, do not add retries back.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

      # The PyInstaller invocation and its smoke test live in one place, so
      # the binary the real-machine workflow tests is built by the same lines
      # as the binary shipped from here.
      - uses: ./.github/actions/build-binary

      # The glibc floor is invisible from the outside: the executable itself
      # reports GLIBC_2.14 and says nothing about the libraries packed inside
      # it. Only unpacking the archive catches a build that cannot start
      # anywhere but the runner that made it.
      - name: Linux binary must run on more than this runner
        if: runner.os == 'Linux'
        run: python scripts/check_glibc.py dist/shambles 2.35

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          mv "${{ matrix.built }}" "out/${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/shamblesw.exe "out/${{ matrix.windowed }}"
          fi
          ls -l out

      # ---- the window ------------------------------------------------------
      #
      # Built after the one-file binary and from a separate install, so Qt
      # cannot leak into the binary above. A folder, not one file: a one-file
      # build unpacks itself on every launch, and with Qt inside that is most
      # of a second before anything draws.
      #
      # libegl1 has to be on the Linux build machine because the spec copies
      # libEGL into the bundle; a bare Linux or WSL install has none, and Qt
      # will not import without it. The xcb libraries are picked up by
      # PyInstaller from wherever the Qt plugins find them.
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
             libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
             libxcb-render-util0 libxcb-xkb1 libdbus-1-3 libfontconfig1

      - name: Build the window
        shell: bash
        run: |
          pip install ".[gui]"
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          pyinstaller --noconfirm packaging/window.spec

      # Same promise as the binary: it must start on more than this runner.
      - name: Linux window must run on more than this runner
        if: runner.os == 'Linux'
        run: python scripts/check_glibc.py dist/shambles-window 2.35

      # Open the real window against an empty home, draw a frame, and keep
      # the picture. This is the only evidence the bundle works on macOS and
      # Windows, where nobody on the project can run it by hand. Offscreen so
      # it needs no display; the frame is what proves QML, fonts and the Qt
      # plugins all made it into the bundle. On Windows the build has no
      # console, so the picture is the whole of the evidence there.
      - name: Smoke-test the window
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          SHAMBLES_WINDOW_SMOKE: window-${{ matrix.artifact }}.png
        run: |
          home="$(mktemp -d)"
          ./dist/shambles-window/shambles-window --home "$home" || status=$?
          cat "window-${{ matrix.artifact }}.png.log" || true
          test "${status:-0}" = 0
          test -s "window-${{ matrix.artifact }}.png"
          # Qt is LGPL: the archive must carry the licence texts.
          test -s dist/shambles-window/licenses/LGPL-3.0.txt
          test -s dist/shambles-window/licenses/NOTICE.txt
          ./dist/shambles-window/shambles-window --version || true
          du -sh dist/shambles-window || true

      - name: Pack the window
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../out/${{ matrix.window }}" shambles-window
          else
            tar -czf "../out/${{ matrix.window }}" shambles-window
          fi
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: window-frame-${{ matrix.artifact }}
          path: window-${{ matrix.artifact }}.png*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # shambles-* only: the window-frame-* artifacts are the smoke test's
      # pictures, kept for review and not part of the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: shambles-*
          merge-multiple: true
          path: dist

      # One file listing the SHA-256 of every binary, so a download can be
      # checked against something GitHub did not serve alongside it. The
      # binaries are unsigned, so this is the only integrity check on offer.
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # A tag with a hyphen (v2.3.0-rc.1) is a test build: published as a
          # pre-release, so it never becomes "latest" and the install
          # scripts keep handing out the last full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Install with one command. Linux, macOS, or WSL:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ianchendev/Shambles/main/scripts/install.sh | bash

            # or pin this release
            curl -fsSL https://raw.githubusercontent.com/ianchendev/Shambles/main/scripts/install.sh | bash -s ${{ github.ref_name }}
            ```

            Windows PowerShell:

            ```powershell
            irm https://raw.githubusercontent.com/ianchendev/Shambles/main/scripts/install.ps1 | iex
            ```

            The scripts fetch the binary for your OS and architecture into
            `~/.local/bin`, or `%LOCALAPPDATA%\Shambles` on Windows. No sudo,
            no admin. You can also take a binary from the asset list below, or
            install with pipx, which needs no matching system libraries:

            ```bash
            pipx install git+https://github.com/ianchendev/Shambles
            ```

            The scripts also fetch **the window**, a separate archive of
            36 to 82 MB depending on the platform, named `shambles-window-…`
            below, and unpack it to
            `~/.local/share/shambles/window` (or
            `%LOCALAPPDATA%\Shambles\window`). `shambles gui` opens it, and
            `shambles gui --classic` opens the older Tk window. It is
            separate because it carries Qt, which would slow every
            other command if it were inside the binary. Set
            `SHAMBLES_NO_WINDOW=1` before running the script to skip it.

            ## Check it worked

            ```bash
            shambles --version
            ```

            A version number means you are done. Otherwise:

            **"shambles is not recognized" or "command not found".** The
            binary is installed; your shell has not noticed yet. On Windows,
            open a new PowerShell window, because only terminals started after
            the install read the stored PATH. On Linux and macOS, put
            `~/.local/bin` on your PATH:

            ```bash
            export PATH="$HOME/.local/bin:$PATH"
            ```

            **`libc.so.6: version 'GLIBC_2.xx' not found`.** Your Linux is
            older than these binaries support. They need glibc 2.35 or newer,
            so Ubuntu 22.04 or later, or Debian 12 or later. Check with
            `ldd --version`, and use the pipx install above on anything older.

            ## Notes

            **Windows ships two binaries.** `shambles.exe` is the one you run
            in a terminal, and it prints. `shamblesw.exe` is the windowed twin
            for a desktop shortcut that should not flash a console. The
            installer places both. There is an x64 pair and a native
            Arm pair; the installer picks.

            **The binaries are unsigned.** Windows SmartScreen warns on first
            run, which is what an unsigned publisher looks like. If you would
            rather not run an unsigned binary that manages credential files,
            use the pipx install above and read the source first.

            To check a download against `SHA256SUMS` below:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            ```powershell
            Get-FileHash .\shambles-windows-x64.exe -Algorithm SHA256
            ```

            **macOS and native Windows are checked by CI, not yet by a
            person.** On GitHub's macOS and Windows machines, with made-up
            credentials, a switch changes who `claude auth status` and
            `codex login status` report. Nobody has yet reported signing in
            with a real account through Shambles on either system. The
            README's support table says exactly what was and was not
            established. If a switch seems to do nothing, run
            `shambles doctor`.

            **On Windows, upgrade from 2.1.2 or older before switching.**
            Those versions wrote the Claude login somewhere Claude Code does
            not read.

            **Upgrading from 1.x?** First launch merges your split session
            history back into one shared `~/.claude`, automatically and
            without overwriting anything. Run it with no Claude Code sessions
            open.

            **WSL users:** run the Linux build *inside* WSL. A Windows `.exe`
            manages `C:\Users\<you>\.claude`, which is a different Claude
            Code installation from the one in your WSL home directory.
