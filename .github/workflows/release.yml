name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: shambles-linux-x86_64
            built: dist/shambles
          - os: ubuntu-24.04-arm
            artifact: shambles-linux-arm64
            built: dist/shambles
          # macos-15-intel is the last x86_64 macOS image GitHub offers (the
          # macos-13 label was retired in December 2025) and it disappears in
          # August 2027. macos-15 is Apple Silicon, so the two labels are what
          # produce the two different macOS artifacts -- PyInstaller builds for
          # the architecture it runs on and does not cross-compile.
          - os: macos-15-intel
            artifact: shambles-macos-x86_64
            built: dist/shambles
          - os: macos-15
            artifact: shambles-macos-arm64
            built: dist/shambles
          - os: windows-latest
            artifact: shambles-windows-x64.exe
            built: dist/shambles.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X server (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install
        run: pip install -e ".[dev]" pyinstaller

      # A tag that disagrees with the packaged version ships a binary that
      # announces an update to itself: update_check compares the release tag
      # against __version__, so with checks on every user would be told 2.1.0
      # is available while running a binary that reports 2.0.0 -- and
      # re-running the installer would hand them the same binary, forever.
      # tests/test_packaging.py already pins __version__ against pyproject;
      # only CI can see the tag, so the third side of that triangle lives here.
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import shambles; print(shambles.__version__)')"
          if [ "$tag" != "$code" ]; then
            echo "Tag $GITHUB_REF_NAME does not match shambles.__version__ ($code)." >&2
            echo "Bump shambles/__init__.py and pyproject.toml, or retag." >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $code."

      # Never ship a build that has not passed its own suite.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      # No xvfb on macOS: Tk talks to the window server, not X11, and the GUI
      # tests already skip themselves on a TclError when no display answers.
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest

      # Windows retries; Linux does not. The TUI suite asserts on rendered
      # output after a fixed number of event-loop pumps, but Textual settles a
      # layout over an indeterminate number of frames, and the Windows runners
      # are slow enough that a random handful loses that race every run --
      # re-running the same commit produced a different failing set each time.
      # Five consecutive failures is therefore the signal worth gating on: a
      # real regression still fails all five, while a frame-timing loss does
      # not. Two was not enough -- one test lost three flips in a row in one
      # run and passed in the next on the same commit. This masks a suite that
      # is racy by construction; replacing its fixed pauses with condition
      # waits is the actual fix, and is follow-up work rather than a release
      # blocker.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --reruns 4 --reruns-delay 1

      # --windowed only on Windows: it suppresses the console window for a GUI
      # app there. On Linux it would swallow the --version and --help output,
      # and on macOS it would produce a .app bundle instead of the single
      # executable the installers download.
      #
      # --add-data is not optional. Provider specs are package data, and
      # PyInstaller bundles only what it can see imported. Without this the
      # binary builds green, passes a --version smoke test, and then fails at
      # runtime the moment it tries to load a provider. macOS takes the same
      # ':' separator as Linux, so those runners share a step; only Windows'
      # ';' forces a second copy of the command.
      #
      # The second --add-data does the same for the TUI's stylesheet:
      # ShamblesTUI.CSS_PATH = "theme.tcss" is resolved and read from disk by
      # Textual at runtime, relative to shambles/app/tui/application.py --
      # it is not imported, so PyInstaller never sees it on its own. The TUI
      # is the bare `shambles` command's default frontend on an interactive
      # terminal, so a binary missing this crashes on startup with a Textual
      # StylesheetError, while --version/--help stay green because neither
      # touches Textual.
      #
      # If a future PyInstaller/Textual upgrade ever fails to bundle a widget
      # module Textual only reaches through its lazy `__getattr__`-based
      # submodule loading (textual.widgets._input, _list_view, etc.) -- i.e.
      # the binary builds and starts but crashes on first use of some widget
      # -- try adding --collect-all textual before assuming it's a code bug.
      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: pyinstaller --onefile --name shambles
             --add-data "shambles/providers/*.json:shambles/providers"
             --add-data "shambles/app/tui/*.tcss:shambles/app/tui"
             shambles/__main__.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name shambles
             --add-data "shambles/providers/*.json;shambles/providers"
             --add-data "shambles/app/tui/*.tcss;shambles/app/tui"
             shambles/__main__.py

      # Every platform, always. A Linux-only smoke test let a broken Windows
      # binary through once already: PyInstaller runs the entry file as a
      # top-level script, so a relative import inside it killed the bundle on
      # startup. Only the Linux job noticed.
      - name: Smoke-test the binary (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./dist/shambles --version
          ./dist/shambles --help

      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # --windowed detaches, so Start-Process -Wait is needed to get the
          # exit code at all.
          $p = Start-Process -FilePath .\dist\shambles.exe `
                             -ArgumentList '--version' `
                             -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) {
            Write-Error "binary exited $($p.ExitCode)"; exit 1
          }
          Write-Host "binary started and exited cleanly"

      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install with one command — Linux, macOS, or WSL:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ianchendev/Shambles/main/scripts/install.sh | bash

            # or pin this release
            curl -fsSL https://raw.githubusercontent.com/ianchendev/Shambles/main/scripts/install.sh | bash -s ${{ github.ref_name }}
            ```

            Windows PowerShell:

            ```powershell
            irm https://raw.githubusercontent.com/ianchendev/Shambles/main/scripts/install.ps1 | iex
            ```

            The scripts download the binary for your OS and architecture from
            the latest release (or the tag you pin) into `~/.local/bin`, or
            `%LOCALAPPDATA%\Shambles` on Windows — no sudo, no admin. You can
            also grab a binary from the asset list below, or install with pipx:

            ```bash
            pipx install git+https://github.com/ianchendev/Shambles
            shambles
            ```

            **The binaries are unsigned.** Windows SmartScreen will warn on
            first run — that is expected for an unsigned publisher. If you
            would rather not run an unsigned binary that manages credential
            files, use the pipx install above and read the source first.

            **Windows account switching is unverified.** Claude Code appears
            to keep credentials in the Credential Manager there rather than in
            `.credentials.json` — the file Shambles swaps — in which case
            switching would quietly do nothing. The binary builds and runs;
            nobody has confirmed a switch takes effect. See
            `docs/token-storage.md`.

            **macOS account switching is not supported.** There are macOS
            binaries below now and the installer will fetch one, but installing
            is not switching support: credentials live in the Keychain there,
            so there is no file for Shambles to swap.

            **Upgrading from 1.x?** First launch merges your split session
            history back into one shared `~/.claude`, automatically and without
            overwriting anything. Run it with no Claude Code sessions open.

            **WSL users:** run the Linux build *inside* WSL. A Windows `.exe`
            manages `C:\Users\<you>\.claude`, which is a different Claude Code
            installation from the one in your WSL home directory.
