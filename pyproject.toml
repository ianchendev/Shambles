[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shambles"
version = "2.2.0"
description = "Switch between Claude Code accounts without waiting for a verification email"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Chen" }]
keywords = ["claude", "claude-code", "account", "profile", "switcher", "symlink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = ["textual>=8.2,<9"]

[project.optional-dependencies]
# The Qt window. Optional because it is by far the largest dependency and the
# CLI, the terminal UI and the classic window all work without it. Essentials
# only: the Addons half is WebEngine, 3D and the like, none of which the
# window uses. Capped below 6.10, which raised the Linux floor to glibc 2.34.
gui = ["PySide6-Essentials>=6.8,<6.10"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.1",
    # Windows only, and only in CI -- see the retry note in .github/workflows.
    "pytest-rerunfailures>=14",
]

[project.scripts]
# Console launcher. Keeps --version and --help usable on every platform.
shambles = "shambles.__main__:main"

[project.gui-scripts]
# Windowed launcher, mirroring the python/pythonw convention. pip generates a
# pythonw.exe-backed .exe for gui-scripts, so a desktop shortcut pointing here
# opens no console window behind the GUI. Nothing is printed from it on
# Windows -- that is the trade, and why the console entry above stays.
shamblesw = "shambles.__main__:main"

[project.urls]
Homepage = "https://github.com/ianchendev/Shambles"
Issues = "https://github.com/ianchendev/Shambles/issues"

[tool.setuptools]
packages = ["shambles", "shambles.app", "shambles.app.tui", "shambles.app.qt", "shambles.providers", "shambles.stores"]

# Provider specs are data, not code, so they need declaring explicitly or they
# ship missing and every provider fails to load at runtime.
[tool.setuptools.package-data]
"shambles.providers" = ["*.json"]
"shambles.app.tui" = ["*.tcss"]
# The window's QML and typeface are read from disk at runtime, like the TUI's
# stylesheet, so they need declaring or an installed copy opens nothing.
"shambles.app.qt" = ["qml/*.qml", "fonts/*.ttf", "fonts/OFL.txt", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# tests/settling.py is shared by the suite in tests/ and in tests/tui/.
pythonpath = ["tests"]
asyncio_mode = "auto"
# A test stuck longer than this dumps every thread's stack, so a hang leaves
# evidence instead of an idle process (one did, for 80 minutes, on a shared
# WSLg display).
faulthandler_timeout = 300
