[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shambles"
version = "2.0.0"
description = "Switch between Claude Code accounts without waiting for a verification email"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Chen" }]
keywords = ["claude", "claude-code", "account", "profile", "switcher", "symlink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Deliberately empty. Tkinter ships with Python and cannot be installed from
# PyPI; listing it here would make `pipx install shambles` fail outright.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# Console launcher. Keeps --version and --help usable on every platform.
shambles = "shambles.__main__:main"

[project.gui-scripts]
# Windowed launcher, mirroring the python/pythonw convention. pip generates a
# pythonw.exe-backed .exe for gui-scripts, so a desktop shortcut pointing here
# opens no console window behind the GUI. Nothing is printed from it on
# Windows -- that is the trade, and why the console entry above stays.
shamblesw = "shambles.__main__:main"

[project.urls]
Homepage = "https://github.com/ianchendev/Shambles"
Issues = "https://github.com/ianchendev/Shambles/issues"

[tool.setuptools]
packages = ["shambles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
